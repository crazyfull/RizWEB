name: Release (manual)

# Runs only when started by hand (Actions tab -> "Release (manual)" -> Run workflow).
#
# For every target below it builds
#   * rizweb-<version>-<target>      the standalone server as ONE static executable (+ default resources)
#   * rizweb-lib-<version>-<target>  the static library package: libRizWEB, the network backend, BoringSSL,
#                                    all headers and RizWEBConfig.cmake (find_package(RizWEB))
# for Linux, Windows and macOS on x86_64 and arm64, and publishes them as a GitHub Release.
#
# BoringSSL is the stock upstream one: RizWEB needs no patch. (netRector builds with a stock BoringSSL
# since its "stock-boringssl-support" change; netRectorClient always did.)
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v (tag becomes v<version>)"
        required: true
        default: "1.4.0"
      draft:
        description: "Create the release as a draft"
        type: boolean
        default: true
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false
      netrector_ref:
        description: "crazyfull/netRector ref (Linux backend; it must build with a stock BoringSSL)"
        default: "stock-boringssl-support"
      netrector_client_ref:
        description: "crazyfull/netRectorClient ref (Windows / macOS backend; it must build with a stock BoringSSL)"
        default: "stock-boringssl-support"
      boringssl_ref:
        description: "google/boringssl commit"
        default: "289645a450721a7210bf9c69d42bf40a0f1ee730"
      docker:
        description: "Also build and push a multi-arch Docker image to ghcr.io"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,   os: ubuntu-22.04,     backend: netRector,       archive: tar.gz }
          - { name: linux-arm64,    os: ubuntu-22.04-arm, backend: netRector,       archive: tar.gz }
          - { name: windows-x86_64, os: windows-latest,   backend: netRectorClient, archive: zip, msvc_arch: x64 }
          - { name: windows-arm64,  os: windows-11-arm,   backend: netRectorClient, archive: zip, msvc_arch: arm64 }
          - { name: macos-arm64,    os: macos-latest,     backend: netRectorClient, archive: tar.gz, osx_arch: arm64 }
          - { name: macos-x86_64,   os: macos-latest,     backend: netRectorClient, archive: tar.gz, osx_arch: x86_64 }

    env:
      BACKEND_DIR: ${{ github.workspace }}/deps/${{ matrix.backend }}
      BSSL_PREFIX: ${{ github.workspace }}/deps/boringssl-install
      ZLIB_PREFIX: ${{ github.workspace }}/deps/zlib-install
      NATIVE: ${{ matrix.osx_arch != 'x86_64' }}      # the macOS x86_64 binary is cross compiled and cannot run here

    steps:
      - uses: actions/checkout@v4

      - name: Checkout ${{ matrix.backend }}
        uses: actions/checkout@v4
        with:
          repository: crazyfull/${{ matrix.backend }}
          ref: ${{ matrix.backend == 'netRector' && inputs.netrector_ref || inputs.netrector_client_ref }}
          path: deps/${{ matrix.backend }}

      - name: Tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev golang-go

      - name: Tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Tools (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y --no-progress

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Static zlib (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.3.1 https://github.com/madler/zlib.git deps/zlib-src
          cmake -GNinja -S deps/zlib-src -B deps/zlib-build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=cl -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded \
            -DCMAKE_INSTALL_PREFIX="$ZLIB_PREFIX" -DZLIB_BUILD_EXAMPLES=OFF
          cmake --build deps/zlib-build
          cmake --install deps/zlib-build

      - name: Cache BoringSSL
        id: bssl-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.BSSL_PREFIX }}
          key: bssl-stock-${{ matrix.name }}-${{ inputs.boringssl_ref }}

      - name: Build BoringSSL (stock)
        if: steps.bssl-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/google/boringssl.git deps/boringssl-src
          git -C deps/boringssl-src checkout "${{ inputs.boringssl_ref }}"
          EXTRA=()
          if [ "$RUNNER_OS" = "Windows" ]; then
            EXTRA+=(-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DOPENSSL_NO_ASM=ON -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl)
          fi
          if [ -n "${{ matrix.osx_arch }}" ]; then
            EXTRA+=(-DCMAKE_OSX_ARCHITECTURES=${{ matrix.osx_arch }})
          fi
          cmake -GNinja -S deps/boringssl-src -B deps/boringssl-build -DCMAKE_BUILD_TYPE=Release "${EXTRA[@]}"
          ninja -C deps/boringssl-build crypto ssl
          mkdir -p "$BSSL_PREFIX/lib"
          find deps/boringssl-build -maxdepth 2 \( -name 'libssl.a' -o -name 'libcrypto.a' -o -name 'ssl.lib' -o -name 'crypto.lib' \) -exec cp {} "$BSSL_PREFIX/lib/" \;
          cp -r deps/boringssl-src/include "$BSSL_PREFIX/include"

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail
          EXTRA=()
          if [ "$RUNNER_OS" = "Windows" ]; then
            EXTRA+=(-DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
                    "-DZLIB_ROOT=$ZLIB_PREFIX" -DZLIB_USE_STATIC_LIBS=ON)
          fi
          if [ -n "${{ matrix.osx_arch }}" ]; then
            EXTRA+=(-DCMAKE_OSX_ARCHITECTURES=${{ matrix.osx_arch }})
          fi
          cmake -GNinja -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DNETRECTOR_DIR="$BACKEND_DIR" \
            -DRIZWEB_BORINGSSL_DIR="$BSSL_PREFIX" \
            -DRIZWEB_ENABLE_TLS=ON -DRIZWEB_STATIC=ON -DRIZWEB_BUILD_TESTS=ON "${EXTRA[@]}"

      - name: Build
        run: cmake --build build --parallel

      - name: Unit and integration tests
        if: env.NATIVE == 'true'
        run: ctest --test-dir build --output-on-failure --timeout 300 -C Release

      - name: Smoke test of the executable
        if: env.NATIVE == 'true'
        shell: bash
        run: |
          mkdir -p smoke/www && echo ok > smoke/www/index.html
          BIN="$(find build -maxdepth 1 -name 'rizweb' -o -maxdepth 1 -name 'rizweb.exe' | head -1)"
          cp "$BIN" smoke/ && cd smoke
          printf '[httpServer]\nPort = 18080\nLocatedRoot = %s/www\n' "$PWD" > settings.ini
          ./"$(basename "$BIN")" > server.log 2>&1 &
          sleep 3
          curl -fsS http://127.0.0.1:18080/ | grep -q '^ok'
          kill %1 || true

      - name: Check the executable is static (Linux)
        if: runner.os == 'Linux'
        run: |
          file build/rizweb
          ! ldd build/rizweb 2>&1 | grep -v "not a dynamic executable" | grep -q "=>"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"; T="${{ matrix.name }}"
          cmake --install build --prefix stage
          EXE="rizweb.exe"; [ "$RUNNER_OS" = "Windows" ] || EXE="rizweb"
          [ "$RUNNER_OS" = "Windows" ] || strip "stage/bin/$EXE" || true

          # 1) standalone server: one static executable + default resources
          APP="rizweb-$V-$T"
          mkdir -p "dist/$APP"
          cp "stage/bin/$EXE" "dist/$APP/"
          cp -r stage/share/rizweb/resource "dist/$APP/resource"
          cp README.md "dist/$APP/" || true

          # 2) static library package: lib/ include/ (find_package(RizWEB) via lib/cmake/RizWEB)
          LIB="rizweb-lib-$V-$T"
          mkdir -p "dist/$LIB"
          cp -r stage/lib stage/include "dist/$LIB/"
          cp README.md "dist/$LIB/" || true

          mkdir -p out
          for P in "$APP" "$LIB"; do
            if [ "${{ matrix.archive }}" = "zip" ]; then
              (cd dist && 7z a -tzip "../out/$P.zip" "$P" > /dev/null)
            else
              tar -C dist -czf "out/$P.tar.gz" "$P"
            fi
          done
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  docker:
    if: ${{ inputs.docker }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            NETRECTOR_REF=${{ inputs.netrector_ref }}
            BORINGSSL_REF=${{ inputs.boringssl_ref }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ inputs.version }}
            ${{ steps.image.outputs.name }}:latest

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Checksums
        working-directory: out
        run: sha256sum * > SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS="--generate-notes"
          [ "${{ inputs.prerelease }}" = "true" ] && FLAGS="$FLAGS --prerelease"
          [ "${{ inputs.draft }}" = "true" ] && FLAGS="$FLAGS --draft"
          gh release create "v${{ inputs.version }}" out/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "RizWEB ${{ inputs.version }}" $FLAGS
